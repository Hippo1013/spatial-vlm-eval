[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-vlm-eval"
version = "0.1.0"
description = "Reproducible evaluation pipelines for spatial vision-language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets>=4.8,<5",
  "numpy>=2,<3",
  "Pillow>=10,<13",
  "peft>=0.19,<0.20",
  "torch>=2.5,<3",
  "tqdm>=4.67,<5",
  "transformers>=5.8,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
msmu-qwen-peft-infer = "spatial_vlm_eval.models.qwen25_vl.peft_infer:main"
msmu-openai-compatible-infer = "spatial_vlm_eval.models.openai_compatible.infer:main"
msmu-vllm-processor-preflight = "spatial_vlm_eval.models.openai_compatible.processor_preflight:main"
msmu-vllm-vision-canary = "spatial_vlm_eval.models.openai_compatible.vision_canary:main"
msmu-ssr-infer = "spatial_vlm_eval.models.ssr.infer:main"
msmu-spatialrgpt-infer = "spatial_vlm_eval.models.spatialrgpt.infer:main"
msmu-3dthinker-infer = "spatial_vlm_eval.models.three_d_thinker.infer:main"
msmu-spatialbot-infer = "spatial_vlm_eval.models.spatialbot.infer:main"
msmu-smoke-indices = "spatial_vlm_eval.benchmarks.msmu.smoke_indices:main"
msmu-validate = "spatial_vlm_eval.benchmarks.msmu.prediction_validation:main"
msmu-score = "spatial_vlm_eval.benchmarks.msmu.scorer:main"
cvbench-infer = "spatial_vlm_eval.benchmarks.cv_bench.inference:main"
cvbench-validate = "spatial_vlm_eval.benchmarks.cv_bench.prediction_validation:main"
cvbench-score = "spatial_vlm_eval.benchmarks.cv_bench.scorer:main"
cvbench-score-results = "spatial_vlm_eval.benchmarks.cv_bench.score_results:main"
cvbench-report = "spatial_vlm_eval.benchmarks.cv_bench.report:main"
spbench-si-infer = "spatial_vlm_eval.benchmarks.spbench_si.inference:main"
spbench-si-validate = "spatial_vlm_eval.benchmarks.spbench_si.prediction_validation:main"
spbench-si-score-results = "spatial_vlm_eval.benchmarks.spbench_si.score_results:main"
spbench-si-report = "spatial_vlm_eval.benchmarks.spbench_si.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
